<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw - AI Chat v2.2</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* 流式响应光标动画 */
        .stream-cursor {
            display: inline-block;
            animation: blink 1s infinite;
            color: var(--primary-color);
            font-weight: bold;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        /* 流式消息样式 */
        #stream-message .message-content {
            min-height: 24px;
        }
        
        /* 版本标识 */
        .version-tag {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h1>🦅 OpenClaw <span class="version-tag">v2.2</span></h1>
            <span class="status" id="connection-status">连接中...</span>
        </header>
        
        <div class="chat-messages" id="chat-messages">
            <div class="message system">
                <div class="message-content">
                    欢迎使用 OpenClaw v2.2！支持流式响应，请输入您的问题。
                </div>
            </div>
        </div>
        
        <div class="chat-input-container">
            <textarea 
                id="message-input" 
                placeholder="输入消息... (Enter 发送, Shift+Enter 换行)"
                rows="1"
            ></textarea>
            <button id="send-button" class="send-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>
    
    <script src="/static/js/chat_v2_2.js"></script>
</body>
</html>
